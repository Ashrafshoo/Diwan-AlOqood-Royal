
name: Build Diwan Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Diwan Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Locate project
        shell: bash
        run: |
          if [ -f "$GITHUB_WORKSPACE/package.json" ]; then
            PROJECT_ROOT="$GITHUB_WORKSPACE"
          else
            mkdir -p "$RUNNER_TEMP/diwan-project"

            ARCHIVE=$(find "$GITHUB_WORKSPACE" \
              -maxdepth 4 -type f -iname "*.zip" \
              ! -path "*/.git/*" | head -n 1)

            if [ -z "$ARCHIVE" ]; then
              echo "ERROR: Project ZIP not found"
              exit 1
            fi

            unzip -q "$ARCHIVE" \
              -d "$RUNNER_TEMP/diwan-project"

            PACKAGE_FILE=$(find "$RUNNER_TEMP/diwan-project" \
              -type f -name package.json | head -n 1)

            if [ -z "$PACKAGE_FILE" ]; then
              echo "ERROR: package.json not found"
              exit 1
            fi

            PROJECT_ROOT=$(dirname "$PACKAGE_FILE")
          fi

          echo "PROJECT_DIR=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Verify project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -f package.json
          test -f app.json
          test -f App.tsx

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run typecheck

      - name: Generate Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx expo prebuild --platform android --non-interactive

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Diwan-Android-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
