name: Build Diwan Android APK

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build standalone Diwan APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Download and extract project archive from Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          echo "Using release tag: $RELEASE_TAG"
          mkdir -p "$RUNNER_TEMP/diwan-upload" "$RUNNER_TEMP/diwan-project"

          # GitHub may append -1, -2, etc. to duplicate asset names.
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "Diwan-AlOqood-Royal-Upload*.zip" \
            --dir "$RUNNER_TEMP/diwan-upload"

          mapfile -t ARCHIVES < <(find "$RUNNER_TEMP/diwan-upload" -maxdepth 1 -type f -name 'Diwan-AlOqood-Royal-Upload*.zip' -print)
          if [ "${#ARCHIVES[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one Diwan project ZIP, found ${#ARCHIVES[@]}."
            printf '%s\n' "${ARCHIVES[@]}"
            exit 1
          fi

          unzip -q "${ARCHIVES[0]}" -d "$RUNNER_TEMP/diwan-project"
          PACKAGE_FILE="$(find "$RUNNER_TEMP/diwan-project" -type f -name package.json -print -quit)"
          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json not found inside the selected Release asset."
            find "$RUNNER_TEMP/diwan-project" -maxdepth 4 -type f | head -100
            exit 1
          fi
          PROJECT_ROOT="$(dirname "$PACKAGE_FILE")"
          echo "PROJECT_DIR=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_ROOT"
          echo "Selected archive: ${ARCHIVES[0]}"

      - name: Verify project files
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -s package.json
          test -s app.json
          test -s scripts/verify_data_packages.py

      - name: Verify the four original data packages
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 scripts/verify_data_packages.py

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install --no-audit --no-fund

      - name: Validate Expo configuration
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx expo config --type public

      - name: TypeScript check
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run typecheck

      - name: Generate Android project
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          NODE_ENV: production
        run: npx expo prebuild --platform android --non-interactive

      - name: Build standalone Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK and embedded JavaScript bundle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          ls -lh "$APK"
          unzip -l "$APK" > "$RUNNER_TEMP/apk-contents.txt"
          if ! grep -Eq 'assets/index\.android\.(bundle|hbc)' "$RUNNER_TEMP/apk-contents.txt"; then
            echo "ERROR: Standalone JavaScript bundle is missing from APK."
            exit 1
          fi
          echo "Standalone JavaScript bundle verified."

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: Diwan-Android-Release-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
